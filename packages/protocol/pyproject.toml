[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orditect-protocol"
version = "0.1.7"
description = "Storage interaction contracts for the Orditect ecosystem: unified protocols for content, audit, result, and snapshot storage backends"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "Orditect Contributors" },
]
keywords = ["storage", "protocol", "adapter", "fastapi", "async"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.5,<3",
]

[project.optional-dependencies]
conformance = [
    "pytest>=8.0",
    "pytest-asyncio>=0.26",
]

[project.urls]
Homepage = "https://github.com/orditect/orditect-protocol"
Repository = "https://github.com/orditect/orditect-protocol"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-data]
"orditect.protocol" = ["py.typed"]
"orditect" = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "unit: pure logic tests, no external dependencies",
    "golden: schema snapshot tests (frozen field sets)",
]