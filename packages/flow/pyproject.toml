[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orditect-flow"
version = "0.1.7"
description = "Async task orchestration and lifecycle management for the Orditect ecosystem: recursive composite task governance"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "Orditect Contributors" },
]
keywords = ["task-orchestration", "workflow", "recursive", "async", "fastapi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = [
    "redis>=5.0,<9",
    "httpx>=0.27.0",
    "croniter>=2.0.0",
    "orditect-core>=0.1.7,<0.2",
    "orditect-protocol>=0.1.7,<0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.26",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]

[project.urls]
Homepage = "https://github.com/orditect/orditect"
Repository = "https://github.com/orditect/orditect"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-data]
"orditect.flow" = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "unit: pure logic tests (in-memory infra, no Redis)",
    "integration: integration tests (require Redis)",
    "examples: example tests",
]