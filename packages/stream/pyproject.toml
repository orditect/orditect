[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orditect-stream"
version = "0.1.0"
description = "Streaming rich-media output plane for the Orditect ecosystem: SSE streams, multi-stream mux, placeholder enrichment"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "Orditect Contributors" },
]
keywords = ["sse", "streaming", "llm", "rich-media", "async", "fastapi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.5,<3",
    "orditect-core>=0.1,<0.2",
    "orditect-flow>=0.1,<0.2",
    "orditect-protocol>=0.1,<0.2",
]

[project.optional-dependencies]
fastapi = ["fastapi>=0.115.0"]
all = ["fastapi>=0.115.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.26",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/orditect/orditect"
Repository = "https://github.com/orditect/orditect"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-data]
"orditect.stream" = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "unit: pure logic tests",
    "integration: integration tests (require Redis/taskflow)",
    "golden: protocol snapshot tests",
]